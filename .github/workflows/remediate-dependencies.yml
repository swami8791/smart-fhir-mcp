name: Remediate dependency vulnerabilities (review branch)

on:
  push:
    branches:
      - security/remediate-npm-audit-2026-11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile for reviewed dependency upgrades
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact updated lockfile
        run: npm ci --ignore-scripts
      - name: Check all production and development dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Commit lockfile changes to remediation branch after validation
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): refresh audited npm lockfile"
            git push origin HEAD:security/remediate-npm-audit-2026-11
          fi
