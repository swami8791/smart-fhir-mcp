<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="14" y="10" width="832" height="510" rx="12" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="14" y="10" width="832" height="36" rx="12" fill="#1b1e26"/>
  <rect x="14" y="34" width="832" height="12" fill="#1b1e26"/>
  <circle cx="38" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="58" cy="28" r="6" fill="#febc2e"/>
  <circle cx="78" cy="28" r="6" fill="#28c840"/>
  <text x="430" y="33" fill="#6b7280" font-size="12.5" text-anchor="middle">smart-fhir &#8212; Patient</text>

  <g font-size="13.5">
    <text x="36" y="78"><tspan fill="#4ade80">&gt;</tspan><tspan fill="#e5e7eb"> smart_discover</tspan></text>
    <text x="36" y="100" fill="#64748b">iss    launch.smarthealthit.org/v/r4/fhir</text>
    <text x="36" y="128" fill="#4ade80">200</text>
    <text x="90" y="128" fill="#e5e7eb">smart-configuration</text>
    <text x="822" y="128" fill="#4ade80" text-anchor="end">OK</text>
    <text x="90" y="148" fill="#475569" font-size="11.5">authorization_endpoint &#183; token_endpoint</text>

    <text x="36" y="188"><tspan fill="#4ade80">&gt;</tspan><tspan fill="#e5e7eb"> fhir_search Patient name=Nobody</tspan></text>
    <text x="36" y="216" fill="#4ade80">200</text>
    <text x="90" y="216" fill="#e5e7eb">Bundle    total 0    entry []</text>
    <text x="822" y="216" fill="#fbbf24" text-anchor="end">EMPTY</text>
    <text x="90" y="236" fill="#475569" font-size="11.5">empty search stays empty</text>

    <text x="36" y="276"><tspan fill="#4ade80">&gt;</tspan><tspan fill="#e5e7eb"> fhir_read Patient/does-not-exist</tspan></text>
    <text x="36" y="304" fill="#f87171">404</text>
    <text x="90" y="304" fill="#e5e7eb">not found</text>
    <text x="822" y="304" fill="#f87171" text-anchor="end">404</text>
    <text x="90" y="324" fill="#475569" font-size="11.5">unknown id is 404 &#183; no resource</text>
  </g>

  <rect x="36" y="356" width="788" height="132" rx="8" fill="#0c1410" stroke="#14532d"/>
  <g font-size="15">
    <text x="54" y="400" fill="#4ade80">OK it did not invent a patient</text>
    <text x="54" y="434" fill="#64748b" font-size="12.5">writes off &#183; public synthetic sandbox &#183; no PHI</text>
  </g>
</svg>
